# Pull the 12 BLS series from FRED, run the refresh checks and the back-test,
# then save the snapshot and a data release (data/releases/data-YYYY-MM) with a tag.
# Runs once a month, on demand (Actions tab > Refresh data > Run workflow),
# and when the pull, check or release code changes on main.
# Optional: add a repository secret FRED_API_KEY to use the FRED API instead of CSV.
name: Refresh data

on:
  schedule:
    - cron: "0 6 20 * *"   # 20th of each month, after the mid-month BLS releases
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - opci/**
      - escalation/**
      - location/**
      - scripts/build_calculator_data.py
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to see which releases are already tagged

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # Includes the check that no private_* file is tracked.
      - name: Tests
        run: pytest -q

      # Checks 1 to 3: stale series (reported), discontinued series (fails),
      # revisions above 0.5% since the last snapshot (reported).
      # --strict: fail if FRED cannot be reached, so an outage is seen.
      - name: Pull from FRED and check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m opci.fred --out data/snapshots --strict

      # Check 4: fails if the worst error on the normal years is above 8%.
      # Supply-shock years are reported against the 10% watch limit only.
      - name: Back-test
        run: python -m opci.validate

      - name: Data release
        run: python -m opci.release

      # The web calculator (docs/index.html, GitHub Pages) reads docs/opci_data.js,
      # built from the latest release and location/factors.csv.
      - name: Calculator data
        run: python -m scripts.build_calculator_data

      - name: Commit and tag
        run: |
          git config user.name "opci-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/releases VALIDATION.md docs/validation_chart.svg docs/opci_data.js
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
          for d in data/releases/data-*/; do
            name=$(basename "$d")
            if ! git rev-parse -q --verify "refs/tags/$name" >/dev/null; then
              git tag -a "$name" -m "OPCI data release $name"
              git push origin "refs/tags/$name"
            fi
          done
