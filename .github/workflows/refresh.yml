# Pull the 12 BLS series from FRED and save a cached snapshot in data/snapshots/.
# Runs once a month, on demand (Actions tab > Refresh data > Run workflow),
# and when the pull code or series list changes on main.
# Optional: add a repository secret FRED_API_KEY to use the FRED API instead of CSV.
name: Refresh data

on:
  schedule:
    - cron: "0 6 20 * *"   # 20th of each month, after the mid-month BLS releases
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - opci/fred.py
      - opci/validate.py
      - escalation/series.yaml
      - escalation/public_points.csv
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Pull from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m opci.fred --out data/snapshots

      # Fails if the worst error on the normal years is above 8%.
      # Supply-shock years are reported against the 10% watch limit only.
      - name: Back-test
        run: python -m opci.validate

      - name: Commit snapshot
        run: |
          git config user.name "opci-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots VALIDATION.md
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Data snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
