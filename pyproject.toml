[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opci"
version = "0.1.0"
description = "Open Plant Cost Index: a free, open source plant cost index using only public domain data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Syed Zia Haider" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3"]

[project.urls]
Repository = "https://github.com/ORIMIZ-Consulting/open-plant-cost-index"

[project.scripts]
opci = "opci.cli:main"

[tool.setuptools]
packages = ["opci"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
