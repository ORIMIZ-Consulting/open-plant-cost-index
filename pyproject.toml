[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opci"
dynamic = ["version"]
description = "A free, open source plant cost index, checked against the Chemical Engineering Plant Cost Index (CEPCI), using only public domain data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Zia Haider" }]
maintainers = [{ name = "ORIMIZ Consulting" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["cost index", "cost escalation", "location factor", "process plant", "cost estimating"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3", "build>=1"]

[project.urls]
Repository = "https://github.com/ORIMIZ-Consulting/open-plant-cost-index"
Method = "https://github.com/ORIMIZ-Consulting/open-plant-cost-index/blob/main/METHOD.md"
Validation = "https://github.com/ORIMIZ-Consulting/open-plant-cost-index/blob/main/VALIDATION.md"
Changelog = "https://github.com/ORIMIZ-Consulting/open-plant-cost-index/blob/main/CHANGELOG.md"

[project.scripts]
opci = "opci.cli:main"

[tool.setuptools]
packages = ["opci"]

[tool.setuptools.dynamic]
version = { attr = "opci.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
